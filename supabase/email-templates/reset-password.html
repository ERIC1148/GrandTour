<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Tells clients the design is already dark, so they leave the colours alone
     instead of auto-inverting them. -->
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Grand Tour</title>
</head>
<body style="margin:0;padding:0;background-color:#161013;">
<!-- Grand Tour — reset password. See confirm-signup.html for the constraints. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="margin:0;padding:0;background-color:#161013;">
  <tr>
    <td align="center" style="padding:40px 16px;">

      <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#161013;font-size:1px;line-height:1px;">
        重设 Grand Tour 的登录密码。
      </div>

      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"
             style="width:480px;max-width:100%;background-color:#2a1b21;border:1px solid #3d2a31;">
        <tr>
          <td style="padding:36px 36px 32px 36px;">

            <p style="margin:0 0 28px 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:26px;line-height:1.1;color:#ece5e6;">
              Grand&nbsp;Tour
            </p>

            <p style="margin:0 0 14px 0;font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.45;color:#ece5e6;">
              重设密码
            </p>

            <p style="margin:0 0 28px 0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.65;color:#a8969b;">
              点下面的按钮设置一个新密码。链接短时间内有效。
            </p>

            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td bgcolor="#8a5a46" style="padding:13px 30px;">
                  <a href="{{ .ConfirmationURL }}"
                     style="font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:bold;color:#f6efec;text-decoration:none;display:inline-block;">
                    设置新密码
                  </a>
                </td>
              </tr>
            </table>

            <p style="margin:28px 0 0 0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.6;color:#83737a;">
              按钮打不开就复制这个地址：<br>
              <span style="color:#b07a63;word-break:break-all;">{{ .ConfirmationURL }}</span>
            </p>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding-top:28px;border-top:1px solid #3d2a31;">
                  <p style="margin:0;font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.6;color:#83737a;">
                    不是你申请的？忽略即可，密码不会改变。
                  </p>
                </td>
              </tr>
            </table>

          </td>
        </tr>
      </table>

      <p style="margin:20px 0 0 0;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:12px;color:#6b5b62;">
        Grand Tour
      </p>

    </td>
  </tr>
</table>
</body>
</html>
